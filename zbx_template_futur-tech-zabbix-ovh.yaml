zabbix_export:
  version: '6.0'
  date: '2024-07-15T11:12:26Z'
  groups:
    - uuid: b4e4123eaf014664a0128bf27577fed9
      name: Templates/Futur-Tech/Web
  templates:
    - uuid: 03bcdf41f75640dfb62a37521dbf0adf
      template: 'Futur-Tech OVH API'
      name: 'Futur-Tech OVH API'
      description: 'https://github.com/Futur-Tech/futur-tech-zabbix-ovh'
      groups:
        - name: Templates/Futur-Tech/Web
      discovery_rules:
        - uuid: d3f89786925743249c55679d95c00a66
          name: 'Domain discovery'
          type: EXTERNAL
          key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/domain/zone"]'
          delay: 10h
          item_prototypes:
            - uuid: 3002f764d19442ca9bcbe9069c77591d
              name: '{#DOMAIN} zone DNS last update'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/domain/zone/{#DOMAIN}"]'
              delay: 30m
              history: 90d
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.lastUpdate
                - type: JAVASCRIPT
                  parameters:
                    - 'return Date.parse(value)'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: DNS
              trigger_prototypes:
                - uuid: 782fedda1c9e4dd596791f9250210a3a
                  expression: 'now()-last(/Futur-Tech OVH API/ovh-api-get.py["{$OVH_API_CONF_NAME}","/domain/zone/{#DOMAIN}"])<{$OVH_DNS_CHANGED_WARN}'
                  name: '{#DOMAIN} zone DNS has been updated in the last {$OVH_DNS_CHANGED_WARN}'
                  opdata: 'Update date: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web/#/domain/{#DOMAIN}/information'
                  priority: WARNING
          lld_macro_paths:
            - lld_macro: '{#DOMAIN}'
              path: $.discovery
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  //Convert array into a discovery-ready JSON object
                  // https://www.zabbix.com/forum/zabbix-help/419391-utilizing-jsonpath-to-setup-an-lld-macros
                  var array = JSON.parse(value)
                  var len = array.length;
                  var x = 0
                  output = "{ \"data\" :["
                  for (; x < len - 1; x++){
                  output += "{\"discovery\": \"" + array[x] + "\"},"
                  }
                  output += "{\"discovery\": \"" + array[x] + "\"}"
                  output += "]}"
                  return output
            - type: JSONPATH
              parameters:
                - $.data
        - uuid: 465430de0ed54af6abe35c4e58c2429b
          name: 'Email discovery'
          type: EXTERNAL
          key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain","/email/domain/#loop#/account"]'
          delay: 10h
          item_prototypes:
            - uuid: 526e6b4076e944b09aa41fd206ae7563
              name: '{#ACCOUNT}@{#DOMAIN} is blocked'
              type: DEPENDENT
              key: 'email.domain.account.isblocked[{#DOMAIN},{#ACCOUNT}]'
              delay: '0'
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.isBlocked
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/"]'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
              trigger_prototypes:
                - uuid: 00b17cc2bcc046c5be5a3acf43690792
                  expression: |
                    last(/Futur-Tech OVH API/email.domain.account.isblocked[{#DOMAIN},{#ACCOUNT}])<>"false"
                    and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0
                  name: '{#ACCOUNT}@{#DOMAIN} account is blocked'
                  url: 'https://www.ovh.com/manager/web/#/email_domain/{#DOMAIN}/email'
                  priority: HIGH
            - uuid: e5ff90a232ca441bb9bfe6024fb7597c
              name: '{#ACCOUNT}@{#DOMAIN} space available'
              type: DEPENDENT
              key: 'email.domain.account.size[{#DOMAIN},{#ACCOUNT}]'
              delay: '0'
              history: 90d
              units: bytes
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.size
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/"]'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
            - uuid: 03add05163b544f1a7901b62b10fbc32
              name: '{#ACCOUNT}@{#DOMAIN} email count'
              type: DEPENDENT
              key: 'email.domain.usage.count[{#DOMAIN},{#ACCOUNT}]'
              delay: '0'
              history: 90d
              units: email(s)
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.emailCount
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/usage"]'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
              trigger_prototypes:
                - uuid: 4edc967e437942939a018cbf504031c4
                  expression: 'last(/Futur-Tech OVH API/email.domain.usage.count[{#DOMAIN},{#ACCOUNT}])<>0 and min(/Futur-Tech OVH API/email.domain.usage.count[{#DOMAIN},{#ACCOUNT}],#3)<>0 and {$OVH_EMAIL_FETCHMAIL:"{#DOMAIN},{#ACCOUNT}"}=1 and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0'
                  name: '{#ACCOUNT}@{#DOMAIN} account has mail not fetched'
                  opdata: '{ITEM.LASTVALUE1} found'
                  url: 'https://www.ovh.com/manager/web/#/email_domain/{#DOMAIN}/email'
                  priority: AVERAGE
                  description: 'This email account has the macro OVH_EMAIL_FETCHMAIL set to 1. This means that this OVH email account should be kept empty automatically by Fetchmail.'
                  dependencies:
                    - name: '{#ACCOUNT}@{#DOMAIN} account has several mails not fetched'
                      expression: |
                        last(/Futur-Tech OVH API/email.domain.usage.count[{#DOMAIN},{#ACCOUNT}])>1 
                        and min(/Futur-Tech OVH API/email.domain.usage.count[{#DOMAIN},{#ACCOUNT}],#3)>1 
                        and {$OVH_EMAIL_FETCHMAIL:"{#DOMAIN},{#ACCOUNT}"}=1 
                        and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0
                - uuid: 36c72d1246a346eba4ef86935a186a42
                  expression: |
                    last(/Futur-Tech OVH API/email.domain.usage.count[{#DOMAIN},{#ACCOUNT}])>1 
                    and min(/Futur-Tech OVH API/email.domain.usage.count[{#DOMAIN},{#ACCOUNT}],#3)>1 
                    and {$OVH_EMAIL_FETCHMAIL:"{#DOMAIN},{#ACCOUNT}"}=1 
                    and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0
                  name: '{#ACCOUNT}@{#DOMAIN} account has several mails not fetched'
                  opdata: '{ITEM.LASTVALUE1} found'
                  url: 'https://www.ovh.com/manager/web/#/email_domain/{#DOMAIN}/email'
                  priority: HIGH
                  description: 'This email account has the macro OVH_EMAIL_FETCHMAIL set to 1. This means that this OVH email account should be kept empty automatically by Fetchmail.'
            - uuid: c432e96670bc4a6ca9fca691c6ffe3be
              name: '{#ACCOUNT}@{#DOMAIN} space used'
              type: DEPENDENT
              key: 'email.domain.usage.size[{#DOMAIN},{#ACCOUNT}]'
              delay: '0'
              history: 90d
              units: bytes
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.quota
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/usage"]'
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
            - uuid: a22a965127c14962ac2a547d3c837f31
              name: '{#ACCOUNT}@{#DOMAIN} details'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/"]'
              delay: 30m
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
            - uuid: d7967a26cc724305811a24d02c22771b
              name: '{#ACCOUNT}@{#DOMAIN} usage'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/usage"]'
              delay: 30m
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
            - uuid: 60c6fd1849d649339fb5ab271a445ea1
              name: '{#ACCOUNT}@{#DOMAIN} space update quota request'
              type: EXTERNAL
              key: 'ovh-api-post.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/updateUsage"]'
              delay: 90m
              history: 90d
              trends: '0'
              value_type: TEXT
              tags:
                - tag: domain
                  value: '{#DOMAIN}'
                - tag: service
                  value: emails
              trigger_prototypes:
                - uuid: 1dbd5c3fcdab4231800acbeba28150ff
                  expression: 'last(/Futur-Tech OVH API/ovh-api-post.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/updateUsage"],#1)<>"null" and last(/Futur-Tech OVH API/ovh-api-post.py["{$OVH_API_CONF_NAME}","/email/domain/{#DOMAIN}/account/{#ACCOUNT}/updateUsage"],#2)<>"null"'
                  name: '{#ACCOUNT}@{#DOMAIN} account space update request failed'
                  opdata: 'Latest update request output: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web/#/email_domain/{#DOMAIN}/email'
                  priority: WARNING
                  description: |
                    The returned value should be "null".
                    In order to avoid alerts when OVH API is momentarily down, the last 2 values are checked.
          trigger_prototypes:
            - uuid: f47f4edf45db42bea87777a3652bd5d6
              expression: |
                (last(/Futur-Tech OVH API/email.domain.usage.size[{#DOMAIN},{#ACCOUNT}])/last(/Futur-Tech OVH API/email.domain.account.size[{#DOMAIN},{#ACCOUNT}]))*100>95
                and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0
              name: '{#ACCOUNT}@{#DOMAIN} account is almost full'
              opdata: 'Used: {ITEM.LASTVALUE1} Available: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              dependencies:
                - name: '{#ACCOUNT}@{#DOMAIN} account is full'
                  expression: |
                    (last(/Futur-Tech OVH API/email.domain.usage.size[{#DOMAIN},{#ACCOUNT}])/last(/Futur-Tech OVH API/email.domain.account.size[{#DOMAIN},{#ACCOUNT}]))*100>99
                    and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0
            - uuid: fd63864c905d409596a12cae35d34d28
              expression: |
                (last(/Futur-Tech OVH API/email.domain.usage.size[{#DOMAIN},{#ACCOUNT}])/last(/Futur-Tech OVH API/email.domain.account.size[{#DOMAIN},{#ACCOUNT}]))*100>99
                and {$OVH_EMAIL_IGNORE:"{#DOMAIN},{#ACCOUNT}"}=0
              name: '{#ACCOUNT}@{#DOMAIN} account is full'
              opdata: 'Used: {ITEM.LASTVALUE1} Available: {ITEM.LASTVALUE2}'
              url: 'https://www.ovh.com/manager/web/#/email_domain/{#DOMAIN}/email'
              priority: HIGH
          lld_macro_paths:
            - lld_macro: '{#ACCOUNT}'
              path: $.loop_result
            - lld_macro: '{#DOMAIN}'
              path: $.source_result
        - uuid: 03ee830431fb49e0a43e786b526014ff
          name: 'API application discovery'
          type: EXTERNAL
          key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/me/api/application"]'
          delay: 5m
          item_prototypes:
            - uuid: 2132435ceaf241608f2dbc9be8f556d4
              name: 'API application {#APP_ID} name'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/me/api/application/{#APP_ID}"]'
              delay: 15m
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.name
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 2h
              tags:
                - tag: service
                  value: api
              trigger_prototypes:
                - uuid: 5ab3fb69b1d54b31885a8ab56d386c0a
                  expression: 'count(/Futur-Tech OVH API/ovh-api-get.py["{$OVH_API_CONF_NAME}","/me/api/application/{#APP_ID}"],#2)<2'
                  recovery_mode: NONE
                  name: 'New OVH API Key discovered'
                  opdata: 'Application Name: {ITEM.LASTVALUE1} ApplicationId: {#APP_ID}'
                  url: 'https://api.ovh.com/console/?#/me/api/application/%7BapplicationId%7D#GET'
                  priority: HIGH
                  description: 'An new OVH API application has been registered in the OVH Account. This trigger need to be closed manually.'
                  manual_close: 'YES'
          lld_macro_paths:
            - lld_macro: '{#APP_ID}'
              path: $.discovery
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  //Convert array into a discovery-ready JSON object
                  // https://www.zabbix.com/forum/zabbix-help/419391-utilizing-jsonpath-to-setup-an-lld-macros
                  var array = JSON.parse(value)
                  var len = array.length;
                  var x = 0
                  output = "{ \"data\" :["
                  for (; x < len - 1; x++){
                  output += "{\"discovery\": \"" + array[x] + "\"},"
                  }
                  output += "{\"discovery\": \"" + array[x] + "\"}"
                  output += "]}"
                  return output
            - type: JSONPATH
              parameters:
                - $.data
        - uuid: 5b86856641704d559985d917df932fe6
          name: 'Telephony discovery'
          type: EXTERNAL
          key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/telephony","/telephony/#loop#/line"]'
          delay: 10h
          item_prototypes:
            - uuid: 138fcd14c9a544e986f03716090f1083
              name: '{#ACCOUNT} - {#SERVICE} telephony service description'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/telephony/{#ACCOUNT}/line/{#SERVICE}"]'
              delay: 20m
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.description
              tags:
                - tag: account
                  value: '{#ACCOUNT}'
                - tag: service
                  value: telephony
            - uuid: 634f504c9656428987ecec19e2b82558
              name: '{#ACCOUNT} - {#SERVICE} telephony service latest registration'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/telephony/{#ACCOUNT}/line/{#SERVICE}/lastRegistrations"]'
              delay: 20m
              history: 90d
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.[0].datetime'
                - type: JAVASCRIPT
                  parameters:
                    - 'return Date.parse(value)'
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              tags:
                - tag: account
                  value: '{#ACCOUNT}'
                - tag: service
                  value: telephony
              trigger_prototypes:
                - uuid: e37ac8399a8843d3b220806efdb9278d
                  expression: 'now()-last(/Futur-Tech OVH API/ovh-api-get.py["{$OVH_API_CONF_NAME}","/telephony/{#ACCOUNT}/line/{#SERVICE}/lastRegistrations"])>{$OVH_TEL_REGISTRATION_WARN}'
                  name: '{#ACCOUNT} - {#SERVICE} No telephony service registration in the last {$OVH_TEL_REGISTRATION_WARN}'
                  opdata: 'Service Description: {ITEM.LASTVALUE1} Latest registration date: {ITEM.LASTVALUE2}'
                  url: 'https://www.ovhtelecom.fr/manager/#/telephony/{#ACCOUNT}/line/{#SERVICE}/detailsOffer'
                  priority: HIGH
                  description: |
                    This can be a false alarm! 
                    It has been observed that the data from the API and the current OVH console are sometimes not up-to-date concerning the registration date... Use the "Manager v4" from the menu on the left in order to access the old OVH Console to see if data are more up-to-date.
                    
                    Registration of service is valid for max 1 hour.
          lld_macro_paths:
            - lld_macro: '{#ACCOUNT}'
              path: $.source_result
            - lld_macro: '{#SERVICE}'
              path: $.loop_result
        - uuid: 2be8284367dd4cfaadd41b745ee8c7dc
          name: 'Zimbra platform discovery'
          type: EXTERNAL
          key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform"]'
          delay: 10h
          description: 'OVH API v2 returns a list of objects, it is directly usable for discovery without any preprocessing.'
          item_prototypes:
            - uuid: 292b2f36b4c2423897f2f12e96c72e7d
              name: '{#PLATFORM_NAME} Zimbra platform details'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}"]'
              delay: 30m
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: platform
                  value: '{#PLATFORM_NAME}'
                - tag: service
                  value: zimbra
            - uuid: 20fb24eeb00a4aec9fdd81f47776d4ee
              name: '{#PLATFORM_NAME} Zimbra platform status'
              type: DEPENDENT
              key: 'zimbra.platform.status[{#PLATFORM_ID}]'
              delay: '0'
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.resourceStatus
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}"]'
              tags:
                - tag: platform
                  value: '{#PLATFORM_NAME}'
                - tag: service
                  value: zimbra
              trigger_prototypes:
                - uuid: 098c4756af15436e9d916de13f720de0
                  expression: 'last(/Futur-Tech OVH API/zimbra.platform.status[{#PLATFORM_ID}])<>"READY"'
                  name: '{#PLATFORM_NAME} Zimbra platform is not ready'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
                  priority: AVERAGE
            - uuid: 2346cd925b294b5dbfd02b7f09f97ad4
              name: '{#PLATFORM_NAME} Zimbra account slots configured'
              type: DEPENDENT
              key: 'zimbra.platform.slot.configured[{#PLATFORM_ID}]'
              delay: '0'
              history: 90d
              units: 'account(s)'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.currentState.accountsStatistics[*].configuredAccountsCount.sum()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}"]'
              tags:
                - tag: platform
                  value: '{#PLATFORM_NAME}'
                - tag: service
                  value: zimbra
            - uuid: 450722cefd2b49b2a9bbb58a5ccc357e
              name: '{#PLATFORM_NAME} Zimbra account slots free'
              type: DEPENDENT
              key: 'zimbra.platform.slot.free[{#PLATFORM_ID}]'
              delay: '0'
              history: 90d
              units: 'account(s)'
              description: 'Slots which are paid for but not assigned to an email account yet.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.currentState.accountsStatistics[*].availableAccountsCount.sum()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}"]'
              tags:
                - tag: platform
                  value: '{#PLATFORM_NAME}'
                - tag: service
                  value: zimbra
            - uuid: 07e6f77c14164704a86f366622410324
              name: '{#PLATFORM_NAME} Zimbra quota usage refresh request'
              type: EXTERNAL
              key: 'ovh-api-post.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/refreshQuotaUsage"]'
              delay: 90m
              history: 90d
              trends: '0'
              value_type: TEXT
              description: 'Quota usage of the Zimbra accounts is only refreshed on demand, this asks OVH to recompute it for every account of the platform.'
              tags:
                - tag: platform
                  value: '{#PLATFORM_NAME}'
                - tag: service
                  value: zimbra
              trigger_prototypes:
                - uuid: a0d1dc8ec56a4ab6a76c3e6d17c1e8e3
                  expression: 'last(/Futur-Tech OVH API/ovh-api-post.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/refreshQuotaUsage"],#1)<>"null" and last(/Futur-Tech OVH API/ovh-api-post.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/refreshQuotaUsage"],#2)<>"null"'
                  name: '{#PLATFORM_NAME} Zimbra quota usage refresh request failed'
                  opdata: 'Latest refresh request output: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
                  priority: WARNING
                  description: |
                    The returned value should be "null".
                    In order to avoid alerts when OVH API is momentarily down, the last 2 values are checked.
          lld_macro_paths:
            - lld_macro: '{#PLATFORM_ID}'
              path: $.id
            - lld_macro: '{#PLATFORM_NAME}'
              path: $.currentState.name
        - uuid: 1f01e7961574484ca2b769c4ad147a0b
          name: 'Zimbra account discovery'
          type: EXTERNAL
          key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform","/v2/zimbra/platform/#loop#/account","id"]'
          delay: 10h
          description: 'The 4th argument tells the script to loop on the "id" key of each platform object returned by OVH API v2.'
          item_prototypes:
            - uuid: 119fb8c1c77c4e58a17b5301eb1bcb47
              name: '{#EMAIL} details'
              type: EXTERNAL
              key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              delay: 30m
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
            - uuid: 7a883fcfada64e2d81ba2ba36119d8a2
              name: '{#EMAIL} space used'
              type: DEPENDENT
              key: 'zimbra.account.quota.used[{#PLATFORM_ID},{#ACCOUNT_ID}]'
              delay: '0'
              history: 90d
              units: B
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.currentState.quota.used
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
            - uuid: 14324ce3826d4c21a6d08973c37383da
              name: '{#EMAIL} space total'
              type: DEPENDENT
              key: 'zimbra.account.quota.maximum[{#PLATFORM_ID},{#ACCOUNT_ID}]'
              delay: '0'
              history: 90d
              units: B
              description: |
                Total space of the account, offer included plus any additional space bought.
                Not to be confused with the "available" field of the OVH API which is the space left.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.currentState.quota.maximum
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
            - uuid: ee93435efd774fc0814e77337d72edfc
              name: '{#EMAIL} space usage last refresh'
              type: DEPENDENT
              key: 'zimbra.account.quota.refreshed[{#PLATFORM_ID},{#ACCOUNT_ID}]'
              delay: '0'
              history: 90d
              units: unixtime
              description: 'Space usage is not computed in real time by OVH, it is only refreshed when requested by the "Zimbra quota usage refresh request" item.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var date = JSON.parse(value).currentState.quotaRefreshedAt;
                      if (!date) { throw "Space usage was never refreshed"; }
                      //OVH API v2 dates hold microseconds, Date.parse only accepts milliseconds
                      return Date.parse(date.replace(/\.[0-9]+/, ""));
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
              trigger_prototypes:
                - uuid: 39d365a24c6d477281ce5fcaed25bc0b
                  expression: |
                    now()-last(/Futur-Tech OVH API/zimbra.account.quota.refreshed[{#PLATFORM_ID},{#ACCOUNT_ID}])>{$OVH_ZIMBRA_QUOTA_REFRESH_WARN}
                    and {$OVH_ZIMBRA_IGNORE:"{#EMAIL}"}=0
                  name: '{#EMAIL} space usage has not been refreshed in the last {$OVH_ZIMBRA_QUOTA_REFRESH_WARN}'
                  opdata: 'Latest refresh date: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
                  priority: WARNING
                  description: 'The space used reported for this account is stale, the "Zimbra quota usage refresh request" item of the platform is most likely failing.'
            - uuid: b529b10bc6c94dd5b70f5e1a7276176b
              name: '{#EMAIL} last connection'
              type: DEPENDENT
              key: 'zimbra.account.lastconnection[{#PLATFORM_ID},{#ACCOUNT_ID}]'
              delay: '0'
              history: 90d
              units: unixtime
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var date = JSON.parse(value).currentState.lastConnectionAt;
                      if (!date) { throw "Account never connected"; }
                      //OVH API v2 dates hold microseconds, Date.parse only accepts milliseconds
                      return Date.parse(date.replace(/\.[0-9]+/, ""));
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '0.001'
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
            - uuid: 4f74d5c668984bfba6cd608a006afe9c
              name: '{#EMAIL} status'
              type: DEPENDENT
              key: 'zimbra.account.status[{#PLATFORM_ID},{#ACCOUNT_ID}]'
              delay: '0'
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.resourceStatus
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
              trigger_prototypes:
                - uuid: 0e50f8f824a44ec395d974869cf5fd72
                  expression: |
                    last(/Futur-Tech OVH API/zimbra.account.status[{#PLATFORM_ID},{#ACCOUNT_ID}])<>"READY"
                    and {$OVH_ZIMBRA_IGNORE:"{#EMAIL}"}=0
                  name: '{#EMAIL} account is not ready'
                  opdata: 'Status: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
                  priority: AVERAGE
                  description: 'Expected value is READY, anything else (SUSPENDED, ERROR, OUT_OF_SYNC...) means the account is not fully operational.'
            - uuid: 0238fcf192744c2c98b8b019f71adaad
              name: '{#EMAIL} is blocked'
              type: DEPENDENT
              key: 'zimbra.account.detailedstatus[{#PLATFORM_ID},{#ACCOUNT_ID}]'
              delay: '0'
              history: 90d
              trends: '0'
              value_type: TEXT
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      //OVH only reports a detailed status when something is wrong with the account
                      var status = JSON.parse(value).currentState.detailedStatus;
                      if (!status || status.length === 0) { return "OK"; }
                      return status.map(function (s) { return s.status; }).join(",");
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'ovh-api-get.py["{$OVH_API_CONF_NAME}","/v2/zimbra/platform/{#PLATFORM_ID}/account/{#ACCOUNT_ID}"]'
              tags:
                - tag: email
                  value: '{#EMAIL}'
                - tag: offer
                  value: '{#OFFER}'
                - tag: organization
                  value: '{#ORGANIZATION}'
                - tag: service
                  value: zimbra
              trigger_prototypes:
                - uuid: 07ad14f5493f4524aa09fb84147672db
                  expression: |
                    last(/Futur-Tech OVH API/zimbra.account.detailedstatus[{#PLATFORM_ID},{#ACCOUNT_ID}])<>"OK"
                    and {$OVH_ZIMBRA_IGNORE:"{#EMAIL}"}=0
                  name: '{#EMAIL} account is blocked'
                  opdata: 'Detailed status: {ITEM.LASTVALUE1}'
                  url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
                  priority: HIGH
                  description: 'BLOCKEDFORSPAM means the account has been blocked by OVH for sending spam, BILLINGLOCKED means the slot of the account is not paid for anymore.'
          trigger_prototypes:
            - uuid: 43cf35fdedae42c49f0a452c5e41c5a1
              expression: |
                last(/Futur-Tech OVH API/zimbra.account.quota.used[{#PLATFORM_ID},{#ACCOUNT_ID}])>last(/Futur-Tech OVH API/zimbra.account.quota.maximum[{#PLATFORM_ID},{#ACCOUNT_ID}])*{$OVH_ZIMBRA_QUOTA_WARN}/100
                and {$OVH_ZIMBRA_IGNORE:"{#EMAIL}"}=0
              name: '{#EMAIL} account is almost full'
              opdata: 'Used: {ITEM.LASTVALUE1} of {ITEM.LASTVALUE2}'
              url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
              priority: AVERAGE
              dependencies:
                - name: '{#EMAIL} account is full'
                  expression: |
                    last(/Futur-Tech OVH API/zimbra.account.quota.used[{#PLATFORM_ID},{#ACCOUNT_ID}])>last(/Futur-Tech OVH API/zimbra.account.quota.maximum[{#PLATFORM_ID},{#ACCOUNT_ID}])*{$OVH_ZIMBRA_QUOTA_CRIT}/100
                    and {$OVH_ZIMBRA_IGNORE:"{#EMAIL}"}=0
            - uuid: 79647ccb22984780a04d867aea61d1c7
              expression: |
                last(/Futur-Tech OVH API/zimbra.account.quota.used[{#PLATFORM_ID},{#ACCOUNT_ID}])>last(/Futur-Tech OVH API/zimbra.account.quota.maximum[{#PLATFORM_ID},{#ACCOUNT_ID}])*{$OVH_ZIMBRA_QUOTA_CRIT}/100
                and {$OVH_ZIMBRA_IGNORE:"{#EMAIL}"}=0
              name: '{#EMAIL} account is full'
              opdata: 'Used: {ITEM.LASTVALUE1} of {ITEM.LASTVALUE2}'
              url: 'https://www.ovh.com/manager/web-cloud/zimbra-mail'
              priority: HIGH
          lld_macro_paths:
            - lld_macro: '{#ACCOUNT_ID}'
              path: $.loop_result.id
            - lld_macro: '{#EMAIL}'
              path: $.loop_result.currentState.email
            - lld_macro: '{#OFFER}'
              path: $.loop_result.currentState.offer
            - lld_macro: '{#ORGANIZATION}'
              path: $.loop_result.currentState.organizationLabel
            - lld_macro: '{#PLATFORM_ID}'
              path: $.source_result
      tags:
        - tag: Futur-Tech
      macros:
        - macro: '{$OVH_API_CONF_NAME}'
          value: template_api
          description: 'Name of the conf file which contains the API keys in /usr/local/etc/ (without the.conf)'
        - macro: '{$OVH_DNS_CHANGED_WARN}'
          value: 1d
          description: 'Trigger if DNS zone was updated'
        - macro: '{$OVH_EMAIL_FETCHMAIL}'
          value: '0'
          description: 'By default, email accounts are not mailfetched'
        - macro: '{$OVH_EMAIL_FETCHMAIL:"domain.tld, user"}'
          value: '1'
          description: 'Exemple of macro to monitor a mailfetched account (should be kept empty)'
        - macro: '{$OVH_EMAIL_IGNORE}'
          value: '0'
          description: 'By default, email accounts are monitored'
        - macro: '{$OVH_EMAIL_IGNORE:"domain.tld,user"}'
          value: '1'
          description: 'Exemple of macro to ignore trigger for a specific email account.'
        - macro: '{$OVH_TEL_REGISTRATION_WARN}'
          value: 3h
          description: 'Trigger if service is not registered without this time (registration is valid 1 hour)'
        - macro: '{$OVH_ZIMBRA_IGNORE}'
          value: '0'
          description: 'By default, Zimbra email accounts are monitored'
        - macro: '{$OVH_ZIMBRA_IGNORE:"user@domain.tld"}'
          value: '1'
          description: 'Exemple of macro to ignore trigger for a specific Zimbra email account.'
        - macro: '{$OVH_ZIMBRA_QUOTA_CRIT}'
          value: '99'
          description: 'Percentage of used space above which a Zimbra account is considered full'
        - macro: '{$OVH_ZIMBRA_QUOTA_REFRESH_WARN}'
          value: 1d
          description: 'Trigger if the space usage of a Zimbra account has not been refreshed by OVH within this time'
        - macro: '{$OVH_ZIMBRA_QUOTA_WARN}'
          value: '95'
          description: 'Percentage of used space above which a Zimbra account is considered almost full'
